services:
  api:
    build:
      context: .
      target: api
    user: "${STORYBLOCK_UID:-1000}:${STORYBLOCK_GID:-1000}"
    ports:
      - "${STORYBLOCK_BIND_ADDRESS:-0.0.0.0}:${STORYBLOCK_HTTPS_PORT:-8443}:8443"
    environment:
      POLICY: public
      PORT: 8443
      STORYBLOCK_TRUSTED_LAN_ENABLED: "true"
      STORYBLOCK_DATABASE_PATH: /workspace/server/data/storyblock.db
    volumes:
      - ./server/data:/workspace/server/data
    networks: [internal]
    read_only: true
    restart: unless-stopped

  style-worker:
    profiles: [workers]
    build:
      context: .
      target: style-worker
    user: "${STORYBLOCK_UID:-1000}:${STORYBLOCK_GID:-1000}"
    depends_on: [api]
    environment:
      STORYBLOCK_WORKER_ENABLED: "true"
      STORYBLOCK_WORKER_API_BASE_URL: https://api:8443/
      STORYBLOCK_WORKER_NOVEL_ID: ${STORYBLOCK_WORKER_NOVEL_ID:-}
      STORYBLOCK_WORKER_ID: ${STORYBLOCK_WORKER_ID:-style-worker-1}
    volumes:
      - ./client-style-worker/data:/workspace/client-style-worker/data
    networks: [internal]
    read_only: true
    restart: unless-stopped

  llm-worker:
    profiles: [rewrite]
    build:
      context: .
      target: llm-worker
    user: "${STORYBLOCK_UID:-1000}:${STORYBLOCK_GID:-1000}"
    environment:
      STORYBLOCK_LLM_WORKER_ENABLED: "true"
      STORYBLOCK_LLM_WORKER_MODEL_ENDPOINT: ${STORYBLOCK_LLM_MODEL_ENDPOINT:-}
      STORYBLOCK_LLM_WORKER_MODEL_ID: ${STORYBLOCK_LLM_MODEL_ID:-}
    volumes:
      - ./client-llm-worker/data:/workspace/client-llm-worker/data
    networks: [worker-egress]
    read_only: true
    stdin_open: true
    tty: true

networks:
  internal:
    internal: true
  worker-egress:
