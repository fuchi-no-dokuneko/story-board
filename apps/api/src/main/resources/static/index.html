<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>StoryBlock Console</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div>
      <h1>StoryBlock</h1>
      <p>Immutable narrative engine</p>
    </div>
    <div class="status"><span id="status-dot"></span><span id="status-text">Checking API</span></div>
  </header>
  <main>
    <nav aria-label="Quick requests">
      <button type="button" data-method="GET" data-path="/actuator/health">Health</button>
      <button type="button" data-method="GET" data-path="/v1/openapi.yaml">OpenAPI</button>
    </nav>
    <section aria-labelledby="request-title">
      <h2 id="request-title">Request</h2>
      <div class="request-line">
        <select id="method" aria-label="HTTP method">
          <option>GET</option><option>POST</option><option>DELETE</option>
        </select>
        <input id="path" value="/actuator/health" aria-label="Request path" spellcheck="false">
        <button id="send" type="button">Send</button>
      </div>
      <label for="token">Bearer token</label>
      <input id="token" type="password" autocomplete="off" placeholder="Optional for public routes">
      <label for="body">JSON body</label>
      <textarea id="body" rows="10" spellcheck="false">{}</textarea>
    </section>
    <section aria-labelledby="response-title">
      <div class="response-heading">
        <h2 id="response-title">Response</h2>
        <output id="response-status"></output>
      </div>
      <pre id="response">Ready.</pre>
    </section>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
