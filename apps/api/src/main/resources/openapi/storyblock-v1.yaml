          type: string
          format: date-time
      additionalProperties: false
    AccessKeyCreated:
      type: object
      required: [key_id, novel_id, actor_id, scopes, expires_at, secret]
      properties:
        key_id:
          type: string
          pattern: '^key_[0-9a-f-]{36}$'
        novel_id:
          type: string
          pattern: '^nov_[0-9a-f-]{36}$'
        actor_id:
          type: string
          pattern: '^[A-Za-z0-9._:@-]{1,128}$'
        scopes:
          type: array
          items:
            type: string
            enum: [novel:read, novel:analyze, novel:propose, novel:commit, novel:admin, style:analyze, style:admin, rewrite:propose, monitor:submit, worker:execute]
        expires_at:
          type: string
          format: date-time
        secret:
          type: string
          pattern: '^nv_key_[0-9a-f-]{36}\.[A-Za-z0-9_-]{43}$'
          readOnly: true
          description: One-time bearer credential; the response must not be cached.
      additionalProperties: false
    RevokeResponse:
      type: object
      required: [key_id, revoked]
      properties:
        key_id:
          type: string
          pattern: '^key_[0-9a-f-]{36}$'
        revoked:
          type: boolean
      additionalProperties: false
    WorkerClaimRequest:
      type: object
      required: [novel_id, lease_owner, lease_seconds]
      properties:
        novel_id:
          type: string
          pattern: '^nov_[0-9a-f-]{36}$'
        lease_owner:
          type: string
          pattern: '^[A-Za-z0-9._:@-]{1,128}$'
        lease_seconds:
          type: integer
          minimum: 15
          maximum: 1800
      additionalProperties: false
    WorkerClaimResponse:
      type: object
      required: [analysis_id, attempt, idempotent_replay, job_id, lease_owner, lease_until, retention_until, snapshot, status_hash]
      properties:
        analysis_id:
          type: string
          pattern: '^ana_[0-9a-f-]{36}$'
        attempt:
          type: integer
          minimum: 1
          maximum: 20
        idempotent_replay:
          type: boolean
        job_id:
          type: string
          pattern: '^job_[0-9a-f-]{36}$'
        lease_owner:
          type: string
          pattern: '^[A-Za-z0-9._:@-]{1,128}$'
        lease_until:
          type: string
          format: date-time
        retention_until:
          type: string
          format: date-time
        snapshot:
          $ref: "#/components/schemas/StyleAnalysisSnapshot"
        status_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
      additionalProperties: false
    StyleAnalysisSnapshot:
      type: object
      required: [blocks, masking_lexicon, novel_id, profile_version, revision_hash, revision_id]
      properties:
        blocks:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/StyleAnalysisBlock"
        masking_lexicon:
          $ref: "#/components/schemas/StyleMaskingLexicon"
        novel_id:
          type: string
          pattern: '^nov_[0-9a-f-]{36}$'
        profile_version:
          $ref: "#/components/schemas/StyleProfileVersion"
        revision_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        revision_id:
          type: string
          pattern: '^rev_[0-9a-f-]{36}$'
      additionalProperties: false
    StyleAnalysisBlock:
      type: object
      required: [block, intentional_style_shift_reason, narrative_mode, pov, scene_id, speaker_id, stratum_kind]
      properties:
        block:
          $ref: "#/components/schemas/StyleAnalysisNarrativeBlock"
        intentional_style_shift_reason:
          type: [string, "null"]
          maxLength: 500
        narrative_mode:
          type: string
          minLength: 1
          maxLength: 128
        pov:
          type: string
          minLength: 1
          maxLength: 128
        scene_id:
          type: string
          pattern: '^scn_[0-9a-f-]{36}$'
        speaker_id:
          type: [string, "null"]
          pattern: '^[A-Za-z0-9._:@-]{1,128}$'
        stratum_kind:
          type: string
          enum: [narration, dialogue]
      additionalProperties: false
    StyleAnalysisNarrativeBlock:
      type: object
      required: [block_version_id, extensions, id, metadata, order_key, text]
      properties:
        block_version_id:
          type: string
          pattern: '^blv_[0-9a-f-]{36}$'
        extensions:
          type: object
          additionalProperties: true
        id:
          type: string
          pattern: '^blk_[0-9a-f-]{36}$'
        metadata:
          type: object
          additionalProperties: true
        order_key:
          type: string
          pattern: '^[0-9a-f]{32}$'
        text:
          type: string
          minLength: 1
      additionalProperties: false
    WorkerResultRequest:
      type: object
      required: [lease_owner, attempt, snapshot_hash, profile_version_hash, analyzer_contract_hash, window_configuration_hash, summary, windows, trace, completed_at]
      properties:
        lease_owner:
          type: string
          pattern: '^[A-Za-z0-9._:@-]{1,128}$'
        attempt:
          type: integer
          minimum: 1
          maximum: 20
        snapshot_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        profile_version_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        analyzer_contract_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        window_configuration_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        summary:
          $ref: "#/components/schemas/StyleAnalysisSummary"
        windows:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/StyleAnalysisWindowFinding"
        trace:
          oneOf:
            - $ref: "#/components/schemas/CompressedStyleAnalysisTrace"
            - type: object
              not:
                required: [codec, content_base64, content_hash, uncompressed_bytes]
              additionalProperties: true
        completed_at:
          type: string
          format: date-time
      additionalProperties: false
    CompressedStyleAnalysisTrace:
      type: object
      required: [codec, content_base64, content_hash, uncompressed_bytes]
      properties:
        codec:
          const: gzip
        content_base64:
          type: string
          contentEncoding: base64
        content_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        uncompressed_bytes:
          type: integer
          minimum: 2
          maximum: 16777216
      additionalProperties: false
    WorkerResultResponse:
      type: object
      required: [analysis_id, idempotent_replay, job_id, result_hash, status]
      properties:
        analysis_id:
          type: string
          pattern: '^ana_[0-9a-f-]{36}$'
        idempotent_replay:
          type: boolean
        job_id:
          type: string
          pattern: '^job_[0-9a-f-]{36}$'
        result_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        status:
          const: succeeded
      additionalProperties: false
