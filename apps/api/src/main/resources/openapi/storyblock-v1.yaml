openapi: 3.1.0
info:
  title: StoryBlock Engine API
  version: 1.0.0
  description: Immutable, evidence-bound narrative editing contracts.
servers:
  - url: /v1
security:
  - bearerAuth: []
x-http-status-policy:
  "200": Synchronous read, preview, worker result, or idempotent result
  "201": Novel, profile, key, monitor output, or canonical revision created
  "202": Durable analysis, rewrite, or export job accepted
  "400": Malformed JSON, header, cursor, or request contract
  "401": Authentication is missing or invalid
  "403": Authenticated principal lacks the required scope
  "404": Resource does not exist or is not visible
  "409": Idempotency payload or operation state conflicts
  "410": Proposal or retained artifact has expired
  "412": If-Match does not identify the current head
  "413": Request, batch, or artifact exceeds its configured limit
  "422": Deterministic validation rejected the request
  "428": If-Match or Idempotency-Key is missing
  "429": Rate or concurrency limit exceeded
  "503": Storage or worker dependency is unavailable
paths:
  /novels:
    post:
      operationId: createNovel
      summary: Create a novel from an initial canonical revision
      x-required-scopes: ["novel:admin"]
      parameters:
        - $ref: "#/components/parameters/IfMatchForCreation"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNovelRequest"
      responses:
        "201":
          description: Novel created
          headers:
            ETag:
              $ref: "#/components/headers/StrongEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NovelHead"
        default:
          $ref: "#/components/responses/Problem"
  /imports:
    post:
      operationId: importCanonicalPackage
      summary: Import a versioned canonical JSON document or package
      x-required-scopes: ["novel:admin"]
      parameters:
        - $ref: "#/components/parameters/IfMatchForCreation"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        "200":
          description: Existing idempotent import result
          headers:
            ETag:
              $ref: "#/components/headers/StrongEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NovelHead"
        "201":
          description: Canonical package imported atomically
          headers:
            ETag:
              $ref: "#/components/headers/StrongEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NovelHead"
        default:
          $ref: "#/components/responses/Problem"
  /novels/{novelId}:
    get:
      operationId: getNovelHead
      summary: Get current novel head metadata
      x-required-scopes: ["novel:read"]
      parameters:
        - $ref: "#/components/parameters/NovelId"
      responses:
        "200":
          description: Current head metadata
          headers:
            ETag:
              $ref: "#/components/headers/StrongEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NovelHead"
        default:
          $ref: "#/components/responses/Problem"
  /novels/{novelId}/revisions/{revisionId}:
    get:
      operationId: getRevision
      summary: Get an immutable canonical revision
      x-required-scopes: ["novel:read"]
      parameters:
        - $ref: "#/components/parameters/NovelId"
        - $ref: "#/components/parameters/RevisionId"
      responses:
        "200":
          description: Canonical revision
          headers:
            ETag:
              $ref: "#/components/headers/StrongEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalRevision"
        default:
          $ref: "#/components/responses/Problem"
  /novels/{novelId}/renders:
    post:
      operationId: renderRevision
      summary: Render a revision range with resolved metadata
      x-required-scopes: ["novel:read"]
      parameters:
        - $ref: "#/components/parameters/NovelId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenderRequest"
      responses:
        "200":
          description: Deterministic render packet
          headers:
            ETag:
              $ref: "#/components/headers/StrongEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderPacket"
        default:
          $ref: "#/components/responses/Problem"
  /novels/{novelId}/edit-previews:
    post:
      operationId: previewEdit
      summary: Preview and validate one typed edit operation
      x-required-scopes: ["novel:propose"]
      parameters:
        - $ref: "#/components/parameters/NovelId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditPreviewRequest"
      responses:
        "200":
          description: Side-effect-free preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewResponse"
        default:
          $ref: "#/components/responses/Problem"
  /novels/{novelId}/commits:
    post:
      operationId: commitEdit
      summary: Commit one validated operation with atomic head CAS
      x-required-scopes: ["novel:commit"]
      parameters:
        - $ref: "#/components/parameters/NovelId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitRequest"
      responses:
        "200":
          description: Existing idempotent commit result
          headers:
            ETag:
              $ref: "#/components/headers/StrongEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitResponse"
        "201":
          description: New immutable revision committed
          headers:
            ETag:
              $ref: "#/components/headers/StrongEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitResponse"
        default:
          $ref: "#/components/responses/Problem"
  /novels/{novelId}/undo-previews:
    post:
      operationId: previewUndo
      summary: Preview restoration of historical canonical content
      x-required-scopes: ["novel:propose"]
      parameters:
        - $ref: "#/components/parameters/NovelId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UndoPreviewRequest"
      responses:
        "200":
          description: Restore operation preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewResponse"
        default:
          $ref: "#/components/responses/Problem"
  /novels/{novelId}/detector-runs:
    post:
      operationId: runAdjacentDetector
      summary: Run the deterministic adjacent metadata detector
      x-required-scopes: ["novel:analyze"]
      parameters:
        - $ref: "#/components/parameters/NovelId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetectorRunRequest"
      responses:
        "200":
          description: Revision-bound detector findings
          headers:
            ETag:
              $ref: "#/components/headers/StrongEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectorRunResponse"
        default:
          $ref: "#/components/responses/Problem"
  /novels/{novelId}/monitor-packets:
    post:
      operationId: createMonitorPacket
      summary: Resolve a bounded read-only packet for one monitor target
      x-required-scopes: ["novel:read"]
      parameters:
        - $ref: "#/components/parameters/NovelId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonitorPacketRequest"
      responses:
        "200":
          description: Bounded render, detector context, and local invariants
          headers:
            ETag:
              $ref: "#/components/headers/StrongEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorPacket"
        default:
          $ref: "#/components/responses/Problem"
  /novels/{novelId}/monitor-runs:
    post:
      operationId: submitMonitorOutput
      summary: Persist an evidence-bound finding or inert proposed operation
      x-required-scopes: ["monitor:submit"]
      parameters:
        - $ref: "#/components/parameters/NovelId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonitorSubmissionRequest"
      responses:
        "200":
          description: Existing idempotent monitor submission
          headers:
            ETag:
              $ref: "#/components/headers/StrongEtag"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorSubmissionResponse"
        "201":
          description: Immutable monitor output created
          headers:
            ETag:
              $ref: "#/components/headers/StrongEtag"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorSubmissionResponse"
        default:
          $ref: "#/components/responses/Problem"
  /novels/{novelId}/monitor-runs/{monitorRunId}:
    get:
      operationId: getMonitorRun
      summary: Get an immutable monitor output with derived stale state
      x-required-scopes: ["novel:read"]
      parameters:
        - $ref: "#/components/parameters/NovelId"
        - $ref: "#/components/parameters/MonitorRunId"
      responses:
        "200":
          description: Monitor output and current invalidation state
          headers:
            ETag:
              $ref: "#/components/headers/StrongEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitorRunStatus"
        default:
          $ref: "#/components/responses/Problem"
  /novels/{novelId}/style-analyses:
    post:
      operationId: startStyleAnalysis
      summary: Submit a durable style analysis job
      x-required-scopes: ["style:analyze"]
      parameters:
        - $ref: "#/components/parameters/NovelId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StyleAnalysisRequest"
      responses:
        "202":
          description: Durable style analysis job accepted or replayed idempotently
          headers:
            ETag:
              $ref: "#/components/headers/StrongEtag"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StyleAnalysisAccepted"
        default:
          $ref: "#/components/responses/Problem"
  /style-analyses/{analysisId}:
    get:
      operationId: getStyleAnalysis
      summary: Get durable style analysis state and result metadata
      x-required-scopes: ["novel:read"]
      parameters:
        - $ref: "#/components/parameters/AnalysisId"
      responses:
        "200":
          description: Analysis state and canonical result metadata
          headers:
            ETag:
              $ref: "#/components/headers/StrongEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StyleAnalysisView"
        default:
          $ref: "#/components/responses/Problem"
  /style-analyses/{analysisId}/windows:
    get:
      operationId: listStyleAnalysisWindows
      summary: Page canonical window findings for a completed style analysis
      x-required-scopes: ["novel:read"]
      parameters:
        - $ref: "#/components/parameters/AnalysisId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: One stable cursor page of operational window findings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StyleAnalysisWindowPage"
        default:
          $ref: "#/components/responses/Problem"
  /rewrite-proposals:
    post:
      operationId: startRewriteProposal
      summary: Submit a durable LLM rewrite proposal job
      x-required-scopes: ["rewrite:propose"]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RewriteProposalRequest"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        default:
          $ref: "#/components/responses/Problem"
  /rewrite-proposals/{proposalId}:
    get:
      operationId: getRewriteProposal
      summary: Get an immutable rewrite proposal and its validation results
      x-required-scopes: ["novel:read"]
      parameters:
        - $ref: "#/components/parameters/ProposalId"
      responses:
        "200":
          description: Rewrite proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewriteProposal"
        default:
          $ref: "#/components/responses/Problem"
  /style-profiles:
    post:
      operationId: createStyleProfile
      summary: Create an immutable novel-scoped style profile
      x-required-scopes: ["style:admin"]
      parameters:
        - $ref: "#/components/parameters/IfMatchForCreation"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StyleProfileRequest"
      responses:
        "200":
          description: Idempotent replay of the style profile creation
          headers:
            ETag:
              $ref: "#/components/headers/StrongEtag"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StyleProfile"
        "201":
          description: Style profile created
          headers:
            ETag:
              $ref: "#/components/headers/StrongEtag"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StyleProfile"
        default:
          $ref: "#/components/responses/Problem"
  /style-profiles/{profileId}:
    get:
      operationId: getStyleProfile
      summary: Get an immutable style profile within its novel boundary
      x-required-scopes: ["novel:read"]
      parameters:
        - $ref: "#/components/parameters/ProfileId"
      responses:
        "200":
          description: Immutable style profile
          headers:
            ETag:
              $ref: "#/components/headers/StrongEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StyleProfile"
        default:
          $ref: "#/components/responses/Problem"
  /style-profiles/{profileId}/versions:
    post:
      operationId: createStyleProfileVersion
      summary: Create an immutable DRAFT profile baseline version
      x-required-scopes: ["style:admin"]
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
            application/json:
              schema:
                $ref: "#/components/schemas/StyleProfileVersionContent"
      responses:
        "200":
          description: Idempotent replay of profile version creation
          headers:
            ETag:
              $ref: "#/components/headers/StrongEtag"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StyleProfileVersionView"
        "201":
          description: Immutable DRAFT profile version created
          headers:
            ETag:
              $ref: "#/components/headers/StrongEtag"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StyleProfileVersionView"
        default:
          $ref: "#/components/responses/Problem"
  /style-profiles/{profileId}/versions/{versionId}:
    get:
      operationId: getStyleProfileVersion
      summary: Get an immutable profile version and append-only lifecycle
      x-required-scopes: ["novel:read"]
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/ProfileVersionId"
      responses:
        "200":
          description: Style profile version lifecycle view
          headers:
            ETag:
              $ref: "#/components/headers/StrongEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StyleProfileVersionView"
        default:
          $ref: "#/components/responses/Problem"
  /style-profiles/{profileId}/versions/{versionId}/transitions:
    post:
      operationId: transitionStyleProfileVersion
      summary: Append an explicit audited profile lifecycle transition
      x-required-scopes: ["style:admin"]
      parameters:
        - $ref: "#/components/parameters/ProfileId"
        - $ref: "#/components/parameters/ProfileVersionId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StyleProfileTransitionRequest"
      responses:
        "200":
          description: Updated append-only lifecycle view
          headers:
            ETag:
              $ref: "#/components/headers/StrongEtag"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StyleProfileVersionView"
        default:
          $ref: "#/components/responses/Problem"
  /jobs/{jobId}:
    get:
      operationId: getJob
      summary: Get durable job status within its novel authorization boundary
      x-required-scopes: ["novel:read"]
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Durable job state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Problem"
  /artifacts/{artifactId}:
    get:
      operationId: downloadArtifact
      summary: Download a novel-scoped immutable result artifact
      x-required-scopes: ["novel:read"]
      parameters:
        - $ref: "#/components/parameters/ArtifactId"
      responses:
        "200":
          description: Immutable artifact bytes
          headers:
            ETag:
              $ref: "#/components/headers/StrongEtag"
            X-Artifact-Codec:
              $ref: "#/components/headers/ArtifactCodec"
            Content-Disposition:
              $ref: "#/components/headers/ContentDisposition"
          content:
            application/vnd.storyblock.package+json:
              schema:
                type: string
                format: binary
            application/vnd.storyblock.revision+json:
              schema:
                type: string
                format: binary
            application/vnd.storyblock.style-trace+json:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Problem"
  /novels/{novelId}/exports:
    post:
      operationId: startExport
      summary: Submit a canonical JSON or package export job
      x-required-scopes: ["novel:read"]
      parameters:
        - $ref: "#/components/parameters/NovelId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        default:
          $ref: "#/components/responses/Problem"
  /novels/{novelId}/access-keys:
    post:
      operationId: createAccessKey
      summary: Issue a scoped per-novel bearer credential
      x-required-scopes: ["novel:admin"]
      parameters:
        - $ref: "#/components/parameters/NovelId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessKeyRequest"
      responses:
        "201":
          description: Credential issued; secret is returned only once
          headers:
            Cache-Control:
              description: Prevent storage of the one-time credential response.
              schema:
                const: no-store
            Pragma:
              description: Legacy cache prevention for the one-time credential response.
              schema:
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessKeyCreated"
        default:
          $ref: "#/components/responses/Problem"
  /access-keys/{keyId}:
    delete:
      operationId: revokeAccessKey
      summary: Revoke a scoped bearer credential
      x-required-scopes: ["novel:admin"]
      parameters:
        - $ref: "#/components/parameters/KeyId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Key is revoked or was already revoked idempotently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeResponse"
        default:
          $ref: "#/components/responses/Problem"
  /internal/jobs/claims:
    post:
      operationId: claimWorkerJob
      summary: Claim one available or expired durable worker lease
      x-required-scopes: ["worker:execute"]
      parameters:
        - $ref: "#/components/parameters/IfMatchForCreation"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerClaimRequest"
      responses:
        "200":
          description: Claimed style analysis lease and immutable execution snapshot
          headers:
            ETag:
              $ref: "#/components/headers/StrongEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerClaimResponse"
        "204":
          description: No queued or expired style analysis job is available
        default:
          $ref: "#/components/responses/Problem"
  /internal/jobs/{jobId}/results:
    post:
      operationId: submitWorkerResult
      summary: Submit an idempotent version-bound worker result
      x-required-scopes: ["worker:execute"]
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerResultRequest"
      responses:
        "200":
          description: Result accepted or returned idempotently
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerResultResponse"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: nv_<public-key-id>.<256-bit-secret>
  parameters:
    NovelId:
      name: novelId
      in: path
      required: true
      schema:
        type: string
        pattern: '^nov_[0-9a-f-]{36}$'
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
        pattern: '^rev_[0-9a-f-]{36}$'
    AnalysisId:
      name: analysisId
      in: path
      required: true
      schema:
        type: string
        pattern: '^ana_[0-9a-f-]{36}$'
    ProposalId:
      name: proposalId
      in: path
      required: true
      schema:
        type: string
        pattern: '^prp_[0-9a-f-]{36}$'
    MonitorRunId:
      name: monitorRunId
      in: path
      required: true
      schema:
        type: string
        pattern: '^mrun_[0-9a-f-]{36}$'
    ProfileId:
      name: profileId
      in: path
      required: true
      schema:
        type: string
        pattern: '^spf_[0-9a-f-]{36}$'
    ProfileVersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        pattern: '^spv_[0-9a-f-]{36}$'
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        pattern: '^job_[0-9a-f-]{36}$'
    KeyId:
      name: keyId
      in: path
      required: true
      schema:
        type: string
        pattern: '^key_[0-9a-f-]{36}$'
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
        pattern: '^art_[0-9a-f-]{36}$'
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 256
    PageLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: A single quoted strong canonical SHA-256 ETag.
      schema:
        type: string
        pattern: '^"sha256:[0-9a-f]{64}"$'
    IfMatchForCreation:
      name: If-Match
      in: header
      required: true
      description: Wildcard precondition for creation in a collection.
      schema:
        const: '*'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
  headers:
    StrongEtag:
      description: Quoted strong ETag of the canonical revision or immutable resource view.
      required: true
      schema:
        type: string
        pattern: '^"sha256:[0-9a-f]{64}"$'
    Location:
      description: Absolute or origin-relative durable resource URI.
      required: true
      schema:
        type: string
        format: uri-reference
    ArtifactCodec:
      description: Storage encoding applied to the returned bytes.
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9.-]{1,63}$'
    ContentDisposition:
      description: Attachment filename for offline use.
      required: true
      schema:
        type: string
  responses:
    Problem:
      description: RFC problem response with a stable machine code
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    JobAccepted:
      description: Durable job accepted
      headers:
        Location:
          $ref: "#/components/headers/Location"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JobAccepted"
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, detail, instance, request_id]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,63}$'
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        current_revision_id:
          type: string
        current_etag:
          type: string
      additionalProperties: true
    CreateNovelRequest:
      type: object
      required: [initial_revision]
      properties:
        initial_revision:
          $ref: "#/components/schemas/CanonicalRevision"
      additionalProperties: false
    ImportRequest:
      type: object
      required: [format, document]
      properties:
        format:
          type: string
          enum: [canonical-revision, canonical-package]
        document:
          oneOf:
            - $ref: "#/components/schemas/CanonicalRevision"
            - $ref: "#/components/schemas/CanonicalPackage"
      additionalProperties: false
    NovelHead:
      type: object
      required: [novel_id, head_revision_id, head_sequence, head_hash, schema_version]
      properties:
        novel_id:
          type: string
        head_revision_id:
          type: string
        head_sequence:
          type: integer
          minimum: 0
        head_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        schema_version:
          type: string
      additionalProperties: false
    CanonicalRevision:
      type: object
      required: [schema_version, novel_id, revision_id, parent_revision_id, chapters, created_at, content_hash]
      properties:
        schema_version:
          const: 1.0.0
        novel_id:
          type: string
        revision_id:
          type: string
        parent_revision_id:
          type: [string, "null"]
        chapters:
          type: array
          items:
            type: object
            additionalProperties: true
        created_at:
          type: string
          format: date-time
        content_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        extensions:
          type: object
          additionalProperties: true
      additionalProperties: false
    CanonicalPackage:
      type: object
      required: [package_version, manifest, revisions, operations, artifacts]
      properties:
        package_version:
          const: 1.0.0
        manifest:
          $ref: "#/components/schemas/CanonicalPackageManifest"
        revisions:
          type: array
          minItems: 1
          maxItems: 100000
          items:
            $ref: "#/components/schemas/CanonicalPackageRevision"
        operations:
          type: array
          maxItems: 99999
          items:
            $ref: "#/components/schemas/CanonicalPackageOperation"
        artifacts:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/CanonicalPackageArtifact"
      additionalProperties: false
    CanonicalPackageManifest:
      type: object
      required: [novel_id, schema_version, head_revision_id, head_sequence, head_hash, revision_count, operation_count, artifact_count]
      properties:
        novel_id:
          type: string
        schema_version:
          const: 1.0.0
        head_revision_id:
          type: string
        head_sequence:
          type: integer
          minimum: 0
        head_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        revision_count:
          type: integer
          minimum: 1
        operation_count:
          type: integer
          minimum: 0
        artifact_count:
          type: integer
          minimum: 0
      additionalProperties: false
    CanonicalPackageRevision:
      type: object
      required: [sequence, document]
      properties:
        sequence:
          type: integer
          minimum: 0
        document:
          $ref: "#/components/schemas/CanonicalRevision"
      additionalProperties: false
    CanonicalPackageOperation:
      type: object
      required: [sequence, operation_hash, operation, result_revision_id, result_hash, committed_at]
      properties:
        sequence:
          type: integer
          minimum: 1
        operation_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        operation:
          $ref: "#/components/schemas/OperationEnvelope"
        result_revision_id:
          type: string
        result_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        committed_at:
          type: string
          format: date-time
      additionalProperties: false
    CanonicalPackageArtifact:
      type: object
      required: [artifact_id, revision_id, kind, media_type, codec, content_hash, size_bytes, created_at, content_base64]
      properties:
        artifact_id:
          type: string
        revision_id:
          type: string
        kind:
          type: string
        media_type:
          type: string
        codec:
          type: string
        content_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        size_bytes:
          type: integer
          minimum: 0
          maximum: 16777216
        created_at:
          type: string
          format: date-time
        content_base64:
          type: string
          contentEncoding: base64
      additionalProperties: false
    RenderRequest:
      type: object
      required: [revision_id]
      properties:
        revision_id:
          type: string
        from_block_id:
          type: [string, "null"]
        to_block_id:
          type: [string, "null"]
      additionalProperties: false
    RenderPacket:
      type: object
      required: [novel_id, revision_id, revision_hash, renderer_version, range, rendered_text, blocks, resolved_meta, offset_map, scene_boundaries]
      properties:
        novel_id:
          type: string
        revision_id:
          type: string
        revision_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        renderer_version:
          type: string
        range:
          $ref: "#/components/schemas/RenderRange"
        rendered_text:
          type: string
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/RenderedBlock"
        resolved_meta:
          type: array
          items:
            $ref: "#/components/schemas/ResolvedBlockMetadata"
        offset_map:
          type: array
          items:
            $ref: "#/components/schemas/RenderOffset"
        scene_boundaries:
          type: array
          items:
            $ref: "#/components/schemas/ResolvedSceneBoundary"
      additionalProperties: false
    RenderRange:
      type: object
      required: [from_block_id, to_block_id]
      properties:
        from_block_id:
          type: [string, "null"]
        to_block_id:
          type: [string, "null"]
      additionalProperties: false
    RenderedBlock:
      type: object
      required: [block_id, block_version_id, text, local_meta]
      properties:
        block_id:
          type: string
        block_version_id:
          type: string
        text:
          type: string
        local_meta:
          type: object
          additionalProperties: true
      additionalProperties: false
    ResolvedBlockMetadata:
      type: object
      required: [block_id, before, events, after]
      properties:
        block_id:
          type: string
        before:
          $ref: "#/components/schemas/ResolvedMetadataState"
        events:
          type: array
          items:
            type: object
            additionalProperties: true
        after:
          $ref: "#/components/schemas/ResolvedMetadataState"
      additionalProperties: false
    ResolvedMetadataState:
      type: object
      required: [time, location, weather, pov, present_character_ids]
      properties:
        time: {}
        location: {}
        weather: {}
        pov: {}
        present_character_ids:
          type: array
          items:
            type: string
      additionalProperties: false
    RenderOffset:
      type: object
      required: [block_id, rendered_start, rendered_end]
      properties:
        block_id:
          type: string
        rendered_start:
          type: integer
          minimum: 0
        rendered_end:
          type: integer
          minimum: 0
      additionalProperties: false
    ResolvedSceneBoundary:
      type: object
      required: [scene_id, state_in, state_out]
      properties:
        scene_id:
          type: string
        state_in:
          $ref: "#/components/schemas/ResolvedMetadataState"
        state_out:
          $ref: "#/components/schemas/ResolvedMetadataState"
      additionalProperties: false
    OperationEnvelope:
      type: object
      required: [operation_id, idempotency_key, novel_id, base_revision_id, expected_head_hash, type, payload]
      properties:
        operation_id:
          type: string
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 200
        novel_id:
          type: string
        base_revision_id:
          type: string
        expected_head_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        type:
          type: string
          enum: [insert_blocks, replace_block_range, delete_block_range, split_block, merge_blocks, extend_block, move_block_range, correct_block_meta, set_scene_initial_meta, restore_revision_content]
        payload:
          type: object
          additionalProperties: true
      additionalProperties: false
    EditPreviewRequest:
      type: object
      required: [operation, candidate_revision_id, candidate_created_at]
      properties:
        operation:
          $ref: "#/components/schemas/OperationEnvelope"
        candidate_revision_id:
          type: string
        candidate_created_at:
          type: string
          format: date-time
      additionalProperties: false
    CommitRequest:
      allOf:
        - $ref: "#/components/schemas/EditPreviewRequest"
    UndoPreviewRequest:
      type: object
      required: [base_revision_id, restore_revision_id, expected_restore_hash, candidate_revision_id, candidate_created_at]
      properties:
        base_revision_id:
          type: string
        restore_revision_id:
          type: string
        expected_restore_hash:
          type: string
        candidate_revision_id:
          type: string
        candidate_created_at:
          type: string
          format: date-time
      additionalProperties: false
    PreviewResponse:
      type: object
      required: [base_revision_id, base_hash, normalized_operation, candidate_hash, diff, render_packet, violations, warnings, committable]
      properties:
        base_revision_id:
          type: string
        base_hash:
          type: string
        normalized_operation:
          $ref: "#/components/schemas/OperationEnvelope"
        candidate_hash:
          type: string
        diff:
          type: object
        render_packet:
          oneOf:
            - $ref: "#/components/schemas/RenderPacket"
            - type: "null"
        violations:
          type: array
          items:
            type: object
        warnings:
          type: array
          items:
            type: object
        committable:
          type: boolean
      additionalProperties: false
    CommitResponse:
      type: object
      required: [revision_id, sequence, content_hash, operation_id, idempotent_replay]
      properties:
        revision_id:
          type: string
        sequence:
          type: integer
          minimum: 1
        content_hash:
          type: string
        operation_id:
          type: string
        idempotent_replay:
          type: boolean
      additionalProperties: false
    DetectorRunRequest:
      type: object
      required: [revision_id, revision_hash]
      properties:
        revision_id:
          type: string
        revision_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        from_block_id:
          type: [string, "null"]
        to_block_id:
          type: [string, "null"]
      additionalProperties: false
    DetectorRunResponse:
      type: object
      required: [revision_id, revision_hash, rule_version, findings]
      properties:
        revision_id:
          type: string
        revision_hash:
          type: string
        rule_version:
          type: string
        findings:
          type: array
          items:
            $ref: "#/components/schemas/DetectorFinding"
      additionalProperties: false
    DetectorFinding:
      type: object
      required: [finding_id, code, severity, revision_id, revision_hash, rule_version, affected_block_ids, affected_scene_ids, context_block_ids, evidence]
      properties:
        finding_id:
          type: string
          pattern: '^fnd_[0-9a-f-]{36}$'
        code:
          type: string
          enum: [LOCATION_CHANGED_WITHOUT_TRANSITION, CHARACTER_APPEARED_WITHOUT_ENTER, CHARACTER_DISAPPEARED_WITHOUT_EXIT, WEATHER_CHANGED_WITHOUT_EVIDENCE, TIME_DISCONTINUITY, POV_CHANGED_WITHOUT_BOUNDARY, META_TEXT_MISMATCH, INTENTIONAL_SCENE_RESET]
        severity:
          type: string
          enum: [error, warning, info]
        revision_id:
          type: string
        revision_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        rule_version:
          type: string
        affected_block_ids:
          type: array
          uniqueItems: true
          items:
            type: string
        affected_scene_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        context_block_ids:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            type: string
        evidence:
          type: object
          additionalProperties: true
      additionalProperties: false
    MonitorPacketRequest:
      type: object
      required: [revision_id, revision_hash, target_block_id, neighbor_count]
      properties:
        revision_id:
          type: string
          pattern: '^rev_[0-9a-f-]{36}$'
        revision_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        target_block_id:
          type: string
          pattern: '^blk_[0-9a-f-]{36}$'
        neighbor_count:
          type: integer
          minimum: 1
          maximum: 2
      additionalProperties: false
    MonitorPacket:
      type: object
      required: [novel_id, revision_id, revision_hash, monitor_version, rule_version, detector_rule_version, target_block_id, neighbor_count, render_packet, detector_findings, local_invariants, allowed_tools]
      properties:
        novel_id:
          type: string
          pattern: '^nov_[0-9a-f-]{36}$'
        revision_id:
          type: string
          pattern: '^rev_[0-9a-f-]{36}$'
        revision_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        monitor_version:
          type: string
        rule_version:
          type: string
        detector_rule_version:
          type: string
        target_block_id:
          type: string
          pattern: '^blk_[0-9a-f-]{36}$'
        neighbor_count:
          type: integer
          minimum: 1
          maximum: 2
        render_packet:
          $ref: "#/components/schemas/RenderPacket"
        detector_findings:
          type: array
          items:
            $ref: "#/components/schemas/DetectorFinding"
        local_invariants:
          $ref: "#/components/schemas/MonitorLocalInvariants"
        allowed_tools:
          type: array
          minItems: 2
          maxItems: 2
          prefixItems:
            - const: submit_finding
            - const: submit_proposed_operation
      additionalProperties: false
    MonitorLocalInvariants:
      type: object
      required: [affected_ids_must_be_within_window, evidence_required, max_block_graphemes, max_direct_speakers, max_sentences, min_sentences, target_block_version_id, target_scene_id, window_blocks]
      properties:
        affected_ids_must_be_within_window:
          const: true
        evidence_required:
          const: true
        max_block_graphemes:
          const: 100
        max_direct_speakers:
          const: 1
        max_sentences:
          const: 2
        min_sentences:
          const: 1
        target_block_version_id:
          type: string
          pattern: '^blv_[0-9a-f-]{36}$'
        target_scene_id:
          type: string
          pattern: '^scn_[0-9a-f-]{36}$'
        window_blocks:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            $ref: "#/components/schemas/MonitorBlockFingerprint"
      additionalProperties: false
    MonitorBlockFingerprint:
      type: object
      required: [block_id, block_version_id, content_hash]
      properties:
        block_id:
          type: string
          pattern: '^blk_[0-9a-f-]{36}$'
        block_version_id:
          type: string
          pattern: '^blv_[0-9a-f-]{36}$'
        content_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
      additionalProperties: false
    MonitorSubmissionRequest:
      type: object
      required: [revision_id, revision_hash, target_block_id, neighbor_count, rule_version, affected_block_ids, output]
      properties:
        revision_id:
          type: string
          pattern: '^rev_[0-9a-f-]{36}$'
        revision_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        target_block_id:
          type: string
          pattern: '^blk_[0-9a-f-]{36}$'
        neighbor_count:
          type: integer
          minimum: 1
          maximum: 2
        rule_version:
          type: string
        affected_block_ids:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          contains:
            type: string
          items:
            type: string
            pattern: '^blk_[0-9a-f-]{36}$'
        output:
          oneOf:
            - $ref: "#/components/schemas/MonitorFindingOutput"
            - $ref: "#/components/schemas/MonitorProposedOperationOutput"
          discriminator:
            propertyName: kind
            mapping:
              finding: "#/components/schemas/MonitorFindingOutput"
              proposed_operation: "#/components/schemas/MonitorProposedOperationOutput"
      additionalProperties: false
    MonitorFindingOutput:
      type: object
      required: [kind, code, severity, message, evidence]
      properties:
        kind:
          const: finding
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{2,63}$'
        severity:
          type: string
          enum: [error, warning, info]
        message:
          type: string
          minLength: 1
          maxLength: 2000
        evidence:
          $ref: "#/components/schemas/MonitorEvidenceList"
      additionalProperties: false
    MonitorProposedOperationOutput:
      type: object
      required: [kind, operation, evidence]
      properties:
        kind:
          const: proposed_operation
        operation:
          $ref: "#/components/schemas/OperationEnvelope"
        evidence:
          $ref: "#/components/schemas/MonitorEvidenceList"
      additionalProperties: false
    MonitorEvidenceList:
      type: array
      minItems: 1
      maxItems: 16
      items:
        $ref: "#/components/schemas/MonitorEvidence"
    MonitorEvidence:
      type: object
      required: [block_id, start_grapheme, end_grapheme, quote, quote_hash]
      properties:
        block_id:
          type: string
          pattern: '^blk_[0-9a-f-]{36}$'
        start_grapheme:
          type: integer
          minimum: 0
        end_grapheme:
          type: integer
          minimum: 1
        quote:
          type: string
          minLength: 1
        quote_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
      additionalProperties: false
    MonitorRunStatus:
      type: object
      required: [monitor_run_id, output_id, output_kind, novel_id, revision_id, revision_hash, target_block_id, neighbor_count, monitor_version, rule_version, affected_blocks, output, request_hash, submitted_at, state, stale_reasons, rebase_allowed]
      properties:
        monitor_run_id:
          type: string
          pattern: '^mrun_[0-9a-f-]{36}$'
        output_id:
          type: string
          pattern: '^(mis|mpr)_[0-9a-f-]{36}$'
        output_kind:
          type: string
          enum: [finding, proposed_operation]
        novel_id:
          type: string
          pattern: '^nov_[0-9a-f-]{36}$'
        revision_id:
          type: string
          pattern: '^rev_[0-9a-f-]{36}$'
        revision_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        target_block_id:
          type: string
          pattern: '^blk_[0-9a-f-]{36}$'
        neighbor_count:
          type: integer
          minimum: 1
          maximum: 2
        monitor_version:
          type: string
        rule_version:
          type: string
        affected_blocks:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            $ref: "#/components/schemas/MonitorBlockFingerprint"
        output:
          oneOf:
            - $ref: "#/components/schemas/MonitorFindingOutput"
            - $ref: "#/components/schemas/MonitorProposedOperationOutput"
        request_hash:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
        submitted_at:
          type: string
          format: date-time
        state:
          type: string
          enum: [current, stale]
        stale_reasons:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [head_changed, affected_block_changed, affected_block_missing, rule_version_changed]
        rebase_allowed:
          const: false
        idempotent_replay:
          type: boolean
      additionalProperties: false
    MonitorSubmissionResponse:
      allOf:
        - $ref: "#/components/schemas/MonitorRunStatus"
        - type: object
          required: [idempotent_replay]
          properties:
            idempotent_replay:
              type: boolean
    StyleAnalysisRequest:
      type: object
      required: [revision_id, profile_id, profile_version_id]
      properties:
        revision_id:
          type: string
          pattern: '^rev_[0-9a-f-]{36}$'
        profile_id:
          type: string
          pattern: '^spf_[0-9a-f-]{36}$'
        profile_version_id:
          type: string
          pattern: '^spv_[0-9a-f-]{36}$'
        from_block_id:
          type: [string, "null"]
          pattern: '^blk_[0-9a-f-]{36}$'
        to_block_id:
          type: [string, "null"]
          pattern: '^blk_[0-9a-f-]{36}$'
        masking_lexicon:
          $ref: "#/components/schemas/StyleMaskingLexicon"
        max_attempts:
          type: integer
          minimum: 1
          maximum: 20
          default: 3
        retention_days:
          type: integer
          minimum: 1
          maximum: 365
          default: 30
      additionalProperties: false
    StyleAnalysisAccepted:
      type: object
      required: [analysis_id, analysis_uri, idempotent_replay, job_id, status, status_uri]
      properties:
        analysis_id:
          type: string
          pattern: '^ana_[0-9a-f-]{36}$'
        analysis_uri:
          type: string
          format: uri-reference
        idempotent_replay:
          type: boolean
        job_id:
          type: string
          pattern: '^job_[0-9a-f-]{36}$'
        status:
          const: queued
        status_uri:
          type: string
          format: uri-reference
      additionalProperties: false
    StyleMaskingLexicon:
      type: object
      required: [names, places]
      properties:
