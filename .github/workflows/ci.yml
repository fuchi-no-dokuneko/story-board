name: CI

on:
  push:
    branches: [main, "tickets/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install repository-local server
        run: ./install.sh
      - name: Verify
        run: >-
          ./mvnw --batch-mode
          -Dmaven.repo.local="$PWD/.local-tool/maven/repository"
          verify
          -Dtest='!InitialSloQualificationTest'
          -Dsurefire.failIfNoSpecifiedTests=false
      - name: Verify author skill
        run: |
          source scripts/build-environment.sh
          npm --prefix plugin test
      - name: Verify admin UI authentication
        run: node --test server/src/test/js/*.test.cjs
      - name: Verify keyless backup and restore
        run: |
          databases=(server/target/api-http-contract-*.db)
          ./scripts/test-backup.sh "${databases[0]}"
      - name: Smoke-test self-signed HTTPS
        run: |
          ./scripts/local-server.sh start
          trap './scripts/local-server.sh stop || true' EXIT
          curl -4 --fail --silent --show-error \
            --cacert .local/storyblock/tls/public/storyblock.crt \
            https://127.0.0.1:8443/actuator/health
          ./scripts/local-server.sh stop
          trap - EXIT
      - name: Upload API
        uses: actions/upload-artifact@v4
        with:
          name: storyblock-api
          path: server/target/storyblock-api-*.jar
          if-no-files-found: error
