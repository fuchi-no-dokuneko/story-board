name: CI

on:
  push:
    branches: [main, "tickets/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify
        run: ./mvnw --batch-mode verify -Dtest='!InitialSloQualificationTest' -Dsurefire.failIfNoSpecifiedTests=false
      - name: Upload API
        uses: actions/upload-artifact@v4
        with:
          name: storyblock-api
          path: apps/api/target/storyblock-api-*.jar
          if-no-files-found: error
